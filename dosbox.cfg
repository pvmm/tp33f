# Local DOSBox Staging settings for Turbo Pascal 3.3f (tp3.exe).
#
# Used by dosbox.sh in this directory. Everything here is repo-local:
# the launcher passes --noprimaryconf --nolocalconf, so your global
# DOSBox configuration is neither read nor modified.
#
# The repository directory itself is mounted as C: via the relative
# path below. This works because dosbox.sh sets DOSBox's working
# directory to this folder (--working-dir).

[sdl]
fullscreen=false
fulldouble=false
fullresolution=original
windowresolution=original
output=surface
autolock=false

[cpu]
# A 1980s-era speed; plenty for the Z80-targeting command-line compiler.
cpu_cycles = 3000

[mixer]
nosound=true

[autoexec]
@echo off
mount c .
c:
